name: Build XiaoZhi Huy Vector C3 Faces TTP223

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    steps:
      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Extract source ZIP
      # ==========================================
      - name: Extract XiaoZhi source
        shell: bash
        run: |
          set -e

          rm -rf xiaozhi-source
          mkdir -p xiaozhi-source

          unzip -q "Xiaozhi-HuyVector-C3-DasaiMochi-Face-TTP223-v1.0-source.zip" \
            -d xiaozhi-source

          echo "=== Extracted source ==="
          find xiaozhi-source -maxdepth 3 -type f | head -100

      # ==========================================
      # 3. Find actual XiaoZhi project directory
      # ==========================================
      - name: Locate XiaoZhi project
        shell: bash
        run: |
          set -e

          SOURCE_DIR=$(find xiaozhi-source \
            -type f \
            -name "CMakeLists.txt" \
            -print \
            | head -n 1 \
            | xargs dirname)

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: CMakeLists.txt not found."
            exit 1
          fi

          echo "XiaoZhi source directory:"
          echo "$SOURCE_DIR"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 4. Show ESP-IDF version
      # ==========================================
      - name: Check ESP-IDF
        shell: bash
        run: |
          idf.py --version
          python --version

      # ==========================================
      # 5. Build XiaoZhi
      # ==========================================
      - name: Build firmware
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "========================================"
          echo "Building Huy Vector C3"
          echo "========================================"

          python scripts/build.py huy-vector/c3 --language en-US

      # ==========================================
      # 6. Check merged firmware
      # ==========================================
      - name: Check firmware
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "=== Build directory ==="
          ls -lah build/

          if [ ! -f "build/merged-binary.bin" ]; then
            echo ""
            echo "ERROR:"
            echo "build/merged-binary.bin was NOT created."
            echo ""
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "MERGED FIRMWARE FOUND"
          echo "========================================"

          ls -lh build/merged-binary.bin

      # ==========================================
      # 7. Prepare release files
      # ==========================================
      - name: Prepare firmware
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "$SOURCE_DIR/build/merged-binary.bin" \
            release/XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0.bin

          cp "$SOURCE_DIR/build/merged-binary.bin" \
            release/merged-binary.bin

          cat > release/FLASH_INFO.txt <<EOF
XiaoZhi Huy Vector C3
Faces + TTP223 v1.0

Target:
ESP32-C3 Super Mini

Firmware:
XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0.bin

Flash offset:
0x0

IMPORTANT:
This is a merged firmware binary.
Flash the complete binary at offset 0x0.
EOF

          echo "=== Release files ==="
          ls -lh release/

      # ==========================================
      # 8. Create firmware ZIP
      # ==========================================
      - name: Create firmware ZIP
        shell: bash
        run: |
          set -e

          cd release

          zip -9 \
            XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0-FIRMWARE.zip \
            XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0.bin \
            merged-binary.bin \
            FLASH_INFO.txt

          echo "=== Final firmware package ==="
          ls -lh

      # ==========================================
      # 9. Upload firmware artifact
      # ==========================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0
          path: |
            release/XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0.bin
            release/merged-binary.bin
            release/XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0-FIRMWARE.zip
            release/FLASH_INFO.txt
          if-no-files-found: error
