name: Build XiaoZhi Huy Vector C3 Faces TTP223

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ESP-IDF environment
        shell: bash
        run: |
          set -e

          if [ -f /opt/esp/idf/export.sh ]; then
            source /opt/esp/idf/export.sh
          elif [ -f /opt/esp/export.sh ]; then
            source /opt/esp/export.sh
          else
            echo "ERROR: ESP-IDF export.sh not found."
            exit 1
          fi

          echo "ESP-IDF environment loaded."

          idf.py --version
          python --version

          echo "IDF_PATH=$IDF_PATH" >> "$GITHUB_ENV"
          echo "$PATH" >> "$GITHUB_PATH"

      - name: Extract XiaoZhi source
        shell: bash
        run: |
          set -e

          rm -rf xiaozhi-source
          mkdir -p xiaozhi-source

          unzip -q \
            "XC-v1.zip" \
            -d xiaozhi-source

          echo "=== Extracted source ==="
          find xiaozhi-source -maxdepth 3 -type f | head -100

      - name: Locate XiaoZhi project
        shell: bash
        run: |
          set -e

          # Ubah bagian pencarian ini: mencari folder 'scripts' lalu mengambil path induknya
          SOURCE_DIR=$(find xiaozhi-source \
            -type d \
            -name "scripts" \
            -print \
            | head -n 1 \
            | xargs dirname)

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: Project root (containing 'scripts' folder) not found."
            exit 1
          fi

          echo "XiaoZhi source directory:"
          echo "$SOURCE_DIR"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          
      - name: Build firmware
        shell: bash
        run: |
          set -e

          source /opt/esp/idf/export.sh

          cd "$SOURCE_DIR"

          echo "========================================"
          echo "Building XiaoZhi Huy Vector C3"
          echo "Faces + TTP223 v1.0"
          echo "========================================"

          python scripts/build.py huy-vector/c3 --language en-US

      - name: Check firmware
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "=== Build directory ==="
          ls -lah build/

          if [ ! -f "build/merged-binary.bin" ]; then
            echo "ERROR: build/merged-binary.bin was NOT created."
            exit 1
          fi

          echo "========================================"
          echo "MERGED FIRMWARE FOUND"
          echo "========================================"

          ls -lh build/merged-binary.bin

      - name: Prepare firmware
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "$SOURCE_DIR/build/merged-binary.bin" \
            "release/XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0.bin"

          cp \
            "$SOURCE_DIR/build/merged-binary.bin" \
            "release/merged-binary.bin"

          printf '%s\n' \
            "XiaoZhi Huy Vector C3" \
            "Faces + TTP223 v1.0" \
            "" \
            "Target: ESP32-C3 Super Mini" \
            "Flash offset: 0x0" \
            "" \
            "IMPORTANT:" \
            "This is a merged firmware binary." \
            "Flash the complete binary at offset 0x0." \
            > release/FLASH_INFO.txt

          echo "=== Release files ==="
          ls -lh release/

      - name: Create firmware ZIP
        shell: bash
        run: |
          set -e

          cd release

          zip -9 \
            "XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0-FIRMWARE.zip" \
            "XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0.bin" \
            "merged-binary.bin" \
            "FLASH_INFO.txt"

          echo "=== Final firmware package ==="
          ls -lh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0
          path: |
            release/XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0.bin
            release/merged-binary.bin
            release/XiaoZhi-HuyVector-C3-Faces-TTP223-v1.0-FIRMWARE.zip
            release/FLASH_INFO.txt
          if-no-files-found: error
